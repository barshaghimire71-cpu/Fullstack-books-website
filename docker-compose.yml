version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: books-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: books-backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/books_db
      - PORT=5000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: books-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
